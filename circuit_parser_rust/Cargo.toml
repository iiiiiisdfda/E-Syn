[package]
name = "circuit_parser_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "circuit_parser_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.10"
indexmap = "2.0"
rayon = "1.7"  # 兼容旧版 Rust
pyo3 = { version = "0.20", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

