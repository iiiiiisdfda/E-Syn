[package]
name = "e-rewriter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
egg = {version = "0.9.5", features = ["lp"]}
num = "0.4.0"
rand = "0.8"
ndarray = "0.15.4"
ndarray-rand = "0.14.0"
rayon = "1.7"
serde = "1.0.137"
vectorize = { version = "0.2.0", optional = true }
serde_json = "1.0"
saturating = "0.1.0"
xgboost = "0.1.4"
sprs = "0.11"
log = "0.4"
env_logger = "0.10"
csv = "1.1"
indexmap = "1.8.1"
hashbrown = "0.14.3"
symbol_table = { version = "0.3.0", features = ["global"] }
[features]
# forces the use of indexmaps over hashmaps
deterministic = []
serde-1 = [
  "indexmap/serde-1",
  "hashbrown/serde",
  "symbol_table/serde",
  "vectorize",
]